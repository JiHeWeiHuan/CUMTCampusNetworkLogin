[package]
name = "campus-login"
version = "1.0.0"
edition = "2021"
description = "校园网自动登录托盘程序"

[[bin]]
name = "campus-login"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["cookies", "charset"] }
serde_json = "1"
tray-icon = "0.19"
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
